<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<title>CHASEN IDE</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
		<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.min.css" />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@lumino/widgets@2.3.0/style/index.css" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/wunderbaum@0.15.0/dist/wunderbaum.css" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
		<link rel="stylesheet" href="./assets/css/common.css" />
		<script type="importmap">
			{
				"imports": {
					"@lumino/widgets": "https://esm.sh/@lumino/widgets@2.3.0",
					"@lumino/coreutils": "https://esm.sh/@lumino/coreutils@2.1.2",
					"@lumino/signaling": "https://esm.sh/@lumino/signaling@2.1.2",
					"@lumino/virtualdom": "https://esm.sh/@lumino/virtualdom@2.1.2",
					"monaco-editor": "https://esm.sh/monaco-editor@0.45.0",
					"wunderbaum": "https://esm.sh/wunderbaum@0.15.0"
				}
			}
		</script>
	</head>
	<body>

		<!-- Top bar -->
		<header class="topbar">
			<div class="topbar-left">
				<span id="env-badge" class="badge">Loading...</span>
			</div>

			<div class="topbar-center"></div>

			<div class="topbar-right">
				<button id="btn-export-chasen" class="btn btn-icon" title="Export ZIP">
					<span class="material-symbols-outlined">download</span>
				</button>
				<label for="input-import-chasen" class="btn btn-icon" title="Import ZIP">
					<span class="material-symbols-outlined">upload</span>
				</label>
				<input type="file" id="input-import-chasen" accept=".zip" style="display: none;" />
			</div>
		</header>

		<!-- Main IDE workspace -->
		<main class="ide-workspace">
			<!-- Sidebar -->
			<aside class="ide-sidebar" id="sidebar-container">
				<div class="sidebar-header">
					<span>Files</span>
					<div class="sidebar-actions">
						<button id="btn-new-file" class="btn btn-icon" title="新しいファイル">
							<span class="material-symbols-outlined">note_add</span>
						</button>
						<button id="btn-new-folder" class="btn btn-icon" title="新しいフォルダー">
							<span class="material-symbols-outlined">create_new_folder</span>
						</button>
						<button id="btn-refresh-tree" class="btn btn-icon" title="エクスプローラーの最新の情報に更新">
							<span class="material-symbols-outlined">refresh</span>
						</button>
						<button id="btn-collapse-all" class="btn btn-icon" title="エクスプローラーでフォルダーを折りたたむ">
							<span class="material-symbols-outlined">collapse_all</span>
						</button>
					</div>
				</div>
				<div id="file-tree-container" class="file-tree-container dark"></div>
			</aside>

			<!-- Center & Terminal split -->
			<div class="ide-main-pane">
				<div id="editor-tab-bar" class="editor-tab-bar" role="tablist"></div>
				<div id="dock-container"></div>
				<div id="terminal-container"></div>
			</div>
		</main>

		<!-- Toast -->
		<div id="toast" class="toast"></div>

		<script type="module" src="./assets/js/workspace.js"></script>
	</body>
</html>
