version: '3'

vars:
  OUTPUT_DIR: "dist"
  IMG_FILTER: "wasm-alpine-*"
  LOCAL_HOST: '{{.LOCAL_HOST | default "8080"}}'

tasks:
  default:
    aliases:
      - list
    desc: "List all tasks."
    cmds:
      - task --list-all
    silent: true

  build:base:
    cmds:
      - podman build --platform linux/i386 -t wasm-alpine-base -f Dockerfile.base .
    desc: "Build base alpine image."

  build:lang:
    cmds:
      - podman build --platform linux/i386 -t wasm-alpine-{{.LANG}} -f Dockerfile.{{.LANG}}.base .
      - mkdir -p {{.OUTPUT_DIR}}
      - podman create --replace --name temp-{{.LANG}} wasm-alpine-{{.LANG}}
      - podman export temp-{{.LANG}} -o {{.OUTPUT_DIR}}/rootfs-{{.LANG}}.tar
      - podman rm temp-{{.LANG}}
      - "podman run --rm -v ./{{.OUTPUT_DIR}}:/work:z alpine:latest sh -c \"apk add --no-cache genext2fs && mkdir -p /work/rootfs_{{.LANG}}_dir && tar -xf /work/rootfs-{{.LANG}}.tar -C /work/rootfs_{{.LANG}}_dir && genext2fs -B 4096 -d /work/rootfs_{{.LANG}}_dir /work/rootfs-{{.LANG}}.ext2 && rm -rf /work/rootfs_{{.LANG}}_dir /work/rootfs-{{.LANG}}.tar\""
    desc: "Build image for a specified language. (Required: LANG=<lang>)"
    requires:
      vars: [LANG]

  clean:
    cmds:
      - rm -rf {{.OUTPUT_DIR}}
      - podman rmi $(podman images --filter=reference="{{.IMG_FILTER}}" -q)
    desc: "Remove \"{{.OUTPUT_DIR}}\" directory and remove images filtered \"{{.IMG_FILTER}}\"."

  caddy:run:
    cmds:
      - "podman run --rm -it -p {{.LOCAL_HOST}}:8080 -v ./html:/html:z -v ./{{.OUTPUT_DIR}}:/html/dist:z -v ./Caddyfile:/etc/caddy/Caddyfile:z caddy:latest"
    desc: "Run Caddy web server locally. (Default: LOCAL_HOST=8080)"
